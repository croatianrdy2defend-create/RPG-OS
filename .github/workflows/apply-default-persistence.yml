name: Apply default persistence patch
on:
  push:
    branches: [feature/default-persistence-0.9.8]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply v0.9.8 persistence defaults
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('DEV/patch_default_persistence.py')
          text = p.read_text(encoding='utf-8')
          fixes = {
              "replace('DEV/TOOLS/test_autosave.py', 'self.sample(warned_at=15)', 'self.sample(warned_at=20)', count=3)":
              "replace('DEV/TOOLS/test_autosave.py', 'self.sample(warned_at=15)', 'self.sample(warned_at=20)', count=2)",
              "replace('DEV/TOOLS/test_autosave.py', 'self.sample(turn=16, warned_at=15)', 'self.sample(turn=21, warned_at=20)', count=4)":
              "replace('DEV/TOOLS/test_autosave.py', 'self.sample(turn=16, warned_at=15)', 'self.sample(turn=21, warned_at=20)', count=2)",
          }
          for old, new in fixes.items():
              assert old in text, old
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          python3 -B DEV/patch_default_persistence.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('DEV/TOOLS/test_autosave.py')
          text = p.read_text(encoding='utf-8')
          fixes = {
              '        self.assertEqual(result.warned_at, 15)': '        self.assertEqual(result.warned_at, 20)',
              '        self.assertEqual(o.turns_since_save, 15)': '        self.assertEqual(o.turns_since_save, 20)',
              '                 dict(warned_at=16), dict(warned_at=True),': '                 dict(warned_at=21), dict(warned_at=True),',
          }
          for old, new in fixes.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate standalone game
        run: python3 -B GAME/TOOLS/validate.py --root GAME
      - name: Run regressions
        run: python3 -B DEV/run_tests.py --report .release/regressions.json
      - name: Test standalone distribution
        run: python3 -B DEV/test_distribution.py
      - name: Remove migration helper and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm DEV/patch_default_persistence.py .github/workflows/apply-default-persistence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat: default incremental persistence for new campaigns'
          git push origin HEAD:feature/default-persistence-0.9.8
