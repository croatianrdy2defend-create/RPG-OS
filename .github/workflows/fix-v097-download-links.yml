name: Point v0.9.7 docs to current game-only build
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-v097-download-links.yml]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Update player-facing download links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, found {text.count(old)} for {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          current_zip = 'https://github.com/croatianrdy2defend-create/RPG-OS/releases/download/game-v0.9.7-r2/RPG_OS_v0.9.7_Game.zip'
          current_release = 'https://github.com/croatianrdy2defend-create/RPG-OS/releases/tag/game-v0.9.7-r2'
          old_release = 'https://github.com/croatianrdy2defend-create/RPG-OS/releases/tag/game-v0.9.7'
          old_zip = 'https://github.com/croatianrdy2defend-create/RPG-OS/releases/download/game-v0.9.7/RPG_OS_v0.9.7_Game.zip'

          replace(
              'README.md',
              '### [Download the latest files — ZIP](https://github.com/croatianrdy2defend-create/RPG-OS/archive/refs/heads/main.zip)\n\nThe current **RPG OS v0.9.7** files include the 13 September continuity and saving fixes. Extract this repository ZIP and use its **GAME** subfolder as your campaign folder. It includes a simple Freeform rules engine and blank campaign records, ready for your own world and character. RPG OS is free to download; your AI application\'s access requirements and usage costs are separate.\n\n### 1. Download and extract\n\nDownload the ZIP above. On Windows, right-click it and choose **Extract All**; on macOS, double-click it. Put the extracted folder somewhere you can find again, such as Documents. Open the extracted **RPG-OS-main → GAME** folder, where **OS**, **ADMIN**, **INSTANCE** and **MODULES** appear together. That is your campaign folder. Keep the whole folder together and use a separate copy for each campaign.',
              f'### [Download RPG OS v0.9.7 — game files only]({current_zip})\n\nThis is the current **game-only** v0.9.7 build. It contains the playable RPG OS files, including the same-version saving/persistence fixes, without the repository documentation, playtest archive or developer tooling. RPG OS is free to download; your AI application\'s access requirements and usage costs are separate.\n\n### 1. Download and extract\n\nDownload the ZIP above. On Windows, right-click it and choose **Extract All**; on macOS, double-click it. Put the extracted **RPG_OS_v0.9.7** folder somewhere you can find again, such as Documents. Open that folder, where **OS**, **ADMIN**, **INSTANCE** and **MODULES** appear together. That is your campaign folder. Keep the whole folder together and use a separate copy for each campaign.'
          )
          replace('README.md', f'[Game-only release and checksums]({old_release})', f'[Game-only release and checksums]({current_release})')
          replace(
              'README.md',
              f'> GitHub\'s green **Code → Download ZIP** downloads the whole repository. For the latest same-version fixes, open **GAME** inside that extraction. The older [frozen game-only ZIP]({old_zip}) remains available for its original build. After extraction, use the folder containing `OS/AGENTS.md` as the campaign workspace.',
              f'> GitHub\'s green **Code → Download ZIP** downloads the whole development repository. Players normally want the [current game-only ZIP]({current_zip}) instead. The original `game-v0.9.7` asset remains a frozen earlier build.'
          )
          replace(
              'README.md',
              '**Current software: v0.9.7.** This release improves routine pacing, save operation, current-record maintenance and evidence tooling. [Release changes](DOCS/releases/V0.9.7_CHANGES.md). The earlier `game-v0.9.7` release contains the original playable build; current `main` includes the same-version fixes. Earlier release tags and downloads remain unchanged. [What moved and how the smaller package is checked](DOCS/DISTRIBUTION.md).',
              f'**Current software: v0.9.7.** This release improves routine pacing, save operation, current-record maintenance and evidence tooling. [Release changes](DOCS/releases/V0.9.7_CHANGES.md). The current game-only distribution is [`game-v0.9.7-r2`]({current_release}); `r2` is a packaging revision, not a software-version bump. The original `game-v0.9.7` asset remains a frozen earlier build. [What moved and how the smaller package is checked](DOCS/DISTRIBUTION.md).'
          )

          replace(
              'DOCS/BEGINNER_GUIDE.md',
              '1. **[Download the latest RPG OS files — ZIP](https://github.com/croatianrdy2defend-create/RPG-OS/archive/refs/heads/main.zip).** This includes the same-version v0.9.7 saving fixes. The older tagged game-only download remains the original build.\n2. Extract the ZIP. Windows: right-click → **Extract All**. macOS: double-click. On other systems, use your file manager\'s extract function.\n3. Open **RPG-OS-main**, then copy its **GAME** folder to a location you can find again, such as Documents. Rename that copy to your campaign\'s name.\n4. Open your copied GAME folder until these folders appear together:',
              f'1. **[Download the current RPG OS v0.9.7 game-only ZIP]({current_zip}).** This small archive contains only the playable files; you do not need the full GitHub repository.\n2. Extract the ZIP. Windows: right-click → **Extract All**. macOS: double-click. On other systems, use your file manager\'s extract function.\n3. Move or copy the extracted **RPG_OS_v0.9.7** folder to a location you can find again, such as Documents, and rename that copy to your campaign\'s name if you want.\n4. Open that folder until these folders appear together:'
          )
          replace(
              'DOCS/BEGINNER_GUIDE.md',
              'If you used GitHub\'s green **Code → Download ZIP**, you downloaded the entire development repository. Its **GAME** folder contains the playable kit. Copy that GAME folder for your campaign as described above. The documentation, tests and development tools are optional reading outside the game kit.',
              f'If you use GitHub\'s green **Code → Download ZIP**, GitHub will still download the entire development repository. That works, but ordinary players should use the [game-only ZIP]({current_zip}) above instead.'
          )
          PY
      - name: Commit documentation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md DOCS/BEGINNER_GUIDE.md
          git diff --cached --check
          git commit -m 'docs: make current v0.9.7 game-only zip the primary download'
          git push origin HEAD:main
