name: Correct v0.9.7 persistence defaults v3
on:
  push:
    branches: [fix/keep-v0.9.7-persistence-defaults]
permissions:
  contents: write
jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply already-tested correction script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/correct-v097-persistence-v2.yml').read_text(encoding='utf-8')
          marker = '      - name: Restore v0.9.7 baseline and apply same-version persistence defaults\n'
          start = source.index(marker)
          run = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index('      - name: Validate standalone game\n', run)
          block = source[run:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line:
                  raise SystemExit('unexpected workflow indentation: ' + repr(line))
              else:
                  lines.append('')
          Path('/tmp/apply-v097.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-v097.sh
      - name: Validate standalone game
        run: python3 -B GAME/TOOLS/validate.py --root GAME
      - name: Run regressions
        run: python3 -B DEV/run_tests.py --report .release/regressions-v097-defaults.json
      - name: Test standalone distribution
        run: python3 -B DEV/test_distribution.py
      - name: Commit corrected non-workflow tree
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Actions tokens cannot push workflow-file changes. Keep the temporary
          # branch workflows unchanged; they will be removed later through the GitHub API.
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test "$(cat GAME/VERSION)" = "0.9.7"
          test ! -e DOCS/releases/V0.9.8_CHANGES.md
          git commit -m 'fix: keep persistence defaults in v0.9.7'
          git push origin HEAD:fix/keep-v0.9.7-persistence-defaults
