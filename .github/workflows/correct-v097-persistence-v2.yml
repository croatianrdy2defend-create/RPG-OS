name: Correct v0.9.7 persistence defaults v2
on:
  push:
    branches: [fix/keep-v0.9.7-persistence-defaults]
permissions:
  contents: write
jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Restore v0.9.7 baseline and apply same-version persistence defaults
        shell: bash
        run: |
          set -euo pipefail
          git read-tree --reset -u d6a9d92f5542db3cc67fb4ade95af735dbd43968
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          assert Path('GAME/VERSION').read_text(encoding='utf-8').strip() == '0.9.7'

          # Standard new-campaign persistence: short outcome log each PLAY reply,
          # announced checkpoint on 20 completed PLAY replies, full save at session end.
          replace(
              'GAME/ADMIN/AUTOSAVE.md',
              '> Autosave: Enabled under ADMIN/AUTOSAVE.md. Warn one response before automatically invoking a protected complete-present CHECKPOINT when consequential unsaved state or a substantial scene boundary makes it useful, after 15 completed PLAY replies since verified persistence, or at a supported context reading of 65% or more. Coalesce triggers; do not save an unchanged present or repeatedly trigger on an already handled high-context episode. The operator may defer, disable or save immediately. Preserve PC decisions, fictional time and the archive evidence boundary.',
              '> Autosave: Enabled under ADMIN/AUTOSAVE.md. Warn one response before automatically invoking a protected complete-present CHECKPOINT after 20 completed PLAY replies since verified persistence. Consequential-state, substantial-scene-boundary, or supported context-pressure triggers are optional early triggers only when separately accepted for this campaign. Do not save an unchanged present. The operator may defer, disable or save immediately. Preserve PC decisions, fictional time and the archive evidence boundary.'
          )
          replace('GAME/ADMIN/AUTOSAVE.md', '- Cadence: 15 completed PLAY replies since bind/verified persistence.', '- Cadence: 20 completed PLAY replies since bind/verified persistence.')
          replace(
              'GAME/ADMIN/AUTOSAVE.md',
              'With unsaved state, any selected trigger may schedule one checkpoint:',
              'With unsaved state, the standard policy schedules on the 20-reply cadence. A campaign may separately accept any of the early triggers below; if selected, they can schedule a checkpoint before cadence:'
          )
          replace(
              'GAME/ADMIN/AUTOSAVE.md',
              'Example: `echo \'{"enabled":true,"dirty":true,"turn":15,"turns_since_save":15}\' | python -B TOOLS/autosave.py` returns `warn`. At that same turn with `warned_at:15`, it returns `wait`; with `turn:16`, it requests `checkpoint`.',
              'Example: `echo \'{"enabled":true,"dirty":true,"turn":20,"turns_since_save":20}\' | python -B TOOLS/autosave.py` returns `warn`. At that same turn with `warned_at:20`, it returns `wait`; with `turn:21`, it requests `checkpoint`.'
          )

          replace(
              'GAME/ADMIN/NEW_GAME.md',
              'Explain saving in the compact proposal. Default protected saves and any accepted autosave/review policies remain. If requested, propose the [write-only play log](PLAY_PERSISTENCE.md): one or two outcome sentences appended each turn, ADMIN compilation at the accepted checkpoint cadence, and source archiving/selected review at full SAVE. It adds no routine file checking or delivery protocol; notes are working material, not a full transcript. Record `Incremental recording: write-only-log` in the same accepted agreement and use the actual compatible host setup after bind. No extra interview or automatic world-generation setting is required.',
              'Explain saving in the compact proposal. For a new campaign, propose the standard persistence profile by default unless the operator declines or customizes it: `Incremental recording: write-only-log`, one or two outcome sentences appended after each completed PLAY response, and announced CHECKPOINTs on a 20-completed-PLAY-reply cadence under `ADMIN/AUTOSAVE.md`. ADMIN compilation happens at checkpoint; full SAVE archives remaining available source and performs the selected bounded review. These defaults add no routine file checking or delivery protocol, and notes remain working material rather than a full transcript. Record the selected log and autosave policy in the same accepted agreement and use the actual compatible host setup after bind. Existing campaigns are not retrofitted merely by updating the kit. No extra interview or automatic world-generation setting is required.'
          )

          replace(
              'GAME/OS/BOOTSTRAP.md',
              '8. Only if the accepted agreement explicitly enables autosave, follow `ADMIN/AUTOSAVE.md` for its cadence and advance notice. Absent policy means off, not a missing required field.',
              '8. Follow the persistence policy actually recorded in the accepted agreement. New campaigns normally record the standard write-only log plus announced 20-reply checkpoint cadence during setup unless the operator declined or customized them. Existing campaigns with no autosave grant remain off; absence is not a missing required field.'
          )
          replace('GAME/TOOLS/autosave.py', '    interval: int = 15', '    interval: int = 20')

          replace(
              'GAME/QUICKSTART.md',
              'An opt-in [write-only play log](ADMIN/PLAY_PERSISTENCE.md) appends one or two outcome sentences per exchange without routine persistence checks. Fresh boot reads compiled state and uncompiled notes once; checkpoints compile changes at the accepted cadence, and full SAVE preserves remaining source and selected review. Keep complete backups. Installation enables no policy.',
              'New campaigns default to a [write-only play log](ADMIN/PLAY_PERSISTENCE.md) that appends one or two outcome sentences after each completed PLAY response, plus announced CHECKPOINTs every 20 completed PLAY replies. Fresh boot reads compiled state and uncompiled notes once; checkpoints compile changes, and full SAVE preserves remaining source and selected review. Keep complete backups. You can disable or customize either persistence default during setup or later through recalibration.'
          )
          replace('GAME/QUICKSTART.md', '## Optional announced autosave', '## Standard persistence defaults')
          replace(
              'GAME/QUICKSTART.md',
              'Say: “Enable the standard announced autosave policy in ADMIN/AUTOSAVE.md for this campaign.” The GM records the accepted policy through setup or recalibration; installation alone leaves it off.\n\nThe standard policy warns after consequential unsaved state or substantial scene boundaries, after 15 completed PLAY replies, or at a supported context reading of at least 65%. The meter must actually be accessible or reported by you. One generic warning precedes a checkpoint after the next completed play turn. Several triggers coalesce; nothing runs unattended. “Checkpoint now,” “save now,” “delay autosave,” “resume autosave” and “disable autosave” remain available.',
              'For a new campaign, the compact setup proposal includes the short write-only log and announced checkpointing by default. The log adds one or two concise factual outcome sentences after every completed PLAY response. The standard checkpoint cadence is **20 completed PLAY replies** since verified persistence, with one generic warning before the checkpoint on the following eligible response. Nothing runs unattended.\n\nYou may decline either default during setup, or later say “disable autosave” / request recalibration of incremental recording. “Checkpoint now,” “save now,” “delay autosave” and “resume autosave” remain available. Additional early checkpoint triggers for consequential state, scene boundaries or supported context pressure are opt-in rather than part of the standard cadence.'
          )

          replace('GAME/INSTALLATION.md', '## Optional write-only log', '## Standard write-only log for new campaigns')
          replace(
              'GAME/INSTALLATION.md',
              'This copy includes the separately selected [write-only play log](ADMIN/PLAY_PERSISTENCE.md).',
              'New campaigns select the [write-only play log](ADMIN/PLAY_PERSISTENCE.md) by default unless the operator declines or customizes it during setup.'
          )
          replace(
              'GAME/INSTALLATION.md',
              'Installing v0.9.7 enables no log or invisible memory service.',
              'A new campaign proposes the short log by default; updating an existing campaign does not silently enable it or any invisible memory service.'
          )
          replace(
              'GAME/INSTALLATION.md',
              'The optional [announced autosave policy](ADMIN/AUTOSAVE.md) must be explicitly selected. It invokes the same protected complete-present CHECKPOINT after advance notice; no daemon or mandatory script is required.',
              'New campaigns also propose [announced checkpointing](ADMIN/AUTOSAVE.md) by default: a protected complete-present CHECKPOINT on a 20-completed-PLAY-reply cadence after advance notice. Existing campaigns keep their prior autosave choice unless explicitly recalibrated. No daemon or mandatory script is required.'
          )

          replace(
              'README.md',
              'Autosave and brief write-only PLAY notes are separate optional setup choices. A note does not replace a verified save.',
              'New campaigns default to a brief write-only PLAY note after each completed play response and an announced CHECKPOINT every 20 completed PLAY replies. You can disable or customize either during setup or recalibration. A note does not replace a verified save.'
          )
          replace(
              'DOCS/BEGINNER_GUIDE.md',
              'Autosave starts off unless you select it. To enable the standard policy, say **“Enable the standard announced autosave policy in ADMIN/AUTOSAVE.md for this campaign.”** It announces checkpoints during play; it is not a background service. A checkpoint protects the current state but does not archive new exact dialogue.',
              'New campaigns default to a tiny write-only outcome note after each completed PLAY response and an announced CHECKPOINT every 20 completed PLAY replies. You can decline either during setup or disable/customize them later through recalibration. Checkpointing is not a background service. A checkpoint protects the current state but does not archive new exact dialogue.'
          )
          replace(
              'GAME/README.md',
              'Current `main` includes the **13 September 2026 v0.9.7** saving and continuity fixes. Older tagged game ZIPs retain their original bytes.',
              'Current `main` includes the **v0.9.7** saving and continuity fixes plus the 14 September same-version persistence-default update: short PLAY logging by default for new campaigns and announced checkpoints every 20 completed PLAY replies. Older tagged game ZIPs retain their original bytes.'
          )
          replace(
              'DOCS/CHANGELOG.md',
              '## v0.9.7 — practical pacing and long-campaign maintenance (2026-09-12)\n',
              '## v0.9.7 — practical pacing and long-campaign maintenance (2026-09-12)\n\n- **2026-09-14, same-version persistence-default update:** New campaigns now propose the existing write-only PLAY log by default and announced CHECKPOINTs every 20 completed PLAY replies. END SESSION SAVE remains the full-save boundary. Players can decline or customize either during setup; existing bound campaigns keep their accepted persistence policy unless recalibrated. Version remains **v0.9.7**.\n'
          )

          # Avoid a false release failure when main contains a same-version GAME tree
          # newer than the frozen game-v0.9.7 asset. Historical release bytes stay immutable.
          replace(
              '.github/workflows/release.yml',
              '          if [ -n "$remote_tag" ]; then\n            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"\n            test "$(git rev-parse "$tag:GAME")" = "$(git rev-parse HEAD:GAME)" || {\n              echo \'Existing game distribution contains different files; do not replace it.\' >&2; exit 1;\n            }\n          fi',
              '          if [ -n "$remote_tag" ]; then\n            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"\n            if [ "$(git rev-parse "$tag:GAME")" != "$(git rev-parse HEAD:GAME)" ]; then\n              echo "Existing $tag is a frozen earlier same-version distribution; leaving it unchanged."\n              exit 0\n            fi\n          fi'
          )

          # Exact cadence regression updates. The scheduler itself remains agreement-gated/off
          # by default; NEW_GAME supplies the standard default grant for new campaigns.
          p = Path('DEV/TOOLS/test_autosave.py')
          text = p.read_text(encoding='utf-8')
          exact = [
              ('        return replace(Observation(enabled=True, dirty=True, turn=15, turns_since_save=15), **changes)',
               '        return replace(Observation(enabled=True, dirty=True, turn=20, turns_since_save=20), **changes)', 1),
              ('        self.assertEqual((warning.action, warning.warned_at), ("warn", 15))',
               '        self.assertEqual((warning.action, warning.warned_at), ("warn", 20))', 1),
              ('        self.assertEqual(decide(self.sample(warned_at=15)).action, "wait")',
               '        self.assertEqual(decide(self.sample(warned_at=20)).action, "wait")', 2),
              ('        self.assertEqual(decide(self.sample(turn=16, warned_at=15)).action, "checkpoint")',
               '        self.assertEqual(decide(self.sample(turn=21, warned_at=20)).action, "checkpoint")', 1),
              ('        self.assertEqual(decide(replace(o, turns_since_save=15)).action, "warn")',
               '        self.assertEqual(decide(replace(o, turns_since_save=20)).action, "warn")', 1),
              ('        o = self.sample(turn=16, warned_at=15)',
               '        o = self.sample(turn=21, warned_at=20)', 1),
              ('        self.assertEqual(result.warned_at, 15)',
               '        self.assertEqual(result.warned_at, 20)', 1),
              ('        self.assertEqual(o.turns_since_save, 15)',
               '        self.assertEqual(o.turns_since_save, 20)', 1),
              ('                 dict(warned_at=16), dict(warned_at=True),',
               '                 dict(warned_at=21), dict(warned_at=True),', 1),
              ('        o = self.sample(interval=20)',
               '        o = self.sample(interval=25)', 1),
              ('"15 completed PLAY replies"', '"20 completed PLAY replies"', 1),
              ('        decision = decide(Observation(enabled=True, dirty=True, turn=16, turns_since_save=16, warned_at=15))',
               '        decision = decide(Observation(enabled=True, dirty=True, turn=21, turns_since_save=21, warned_at=20))', 1),
          ]
          for old, new, count in exact:
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'DEV/TOOLS/test_autosave.py: expected {count}, found {actual}: {old!r}')
              text = text.replace(old, new, count)
          needle = '    def test_runtime_routes_are_integrated(self):\n'
          assert text.count(needle) == 1
          addition = '''    def test_new_game_proposes_standard_persistence_defaults(self):\n        body = self.read("ADMIN/NEW_GAME.md")\n        self.assertIn("standard persistence profile by default", body)\n        self.assertIn("20-completed-PLAY-reply cadence", body)\n        self.assertIn("Incremental recording: write-only-log", body)\n\n'''
          p.write_text(text.replace(needle, addition + needle, 1), encoding='utf-8')
          PY
      - name: Validate standalone game
        run: python3 -B GAME/TOOLS/validate.py --root GAME
      - name: Run regressions
        run: python3 -B DEV/run_tests.py --report .release/regressions-v097-defaults.json
      - name: Test standalone distribution
        run: python3 -B DEV/test_distribution.py
      - name: Commit corrected same-version tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test "$(cat GAME/VERSION)" = "0.9.7"
          test ! -e DOCS/releases/V0.9.8_CHANGES.md
          git commit -m 'fix: keep persistence defaults in v0.9.7'
          git push origin HEAD:fix/keep-v0.9.7-persistence-defaults
