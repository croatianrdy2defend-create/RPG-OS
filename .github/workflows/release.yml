name: Publish fresh-install release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require the main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo 'Releases may only be published from main.' >&2; exit 1; }

      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run structural, source, search, evidence, agent, autosave and packaging regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B TOOLS/test_validate.py
          python3 -B TOOLS/test_handover.py
          python3 -B TOOLS/test_package_release.py
          python3 -B TOOLS/test_read_source.py
          python3 -B TOOLS/test_search_index.py
          python3 -B TOOLS/test_evidence.py
          python3 -B TOOLS/test_agent_state.py
          python3 -B TOOLS/test_autosave.py

      - name: Package and verify the committed fresh install
        shell: bash
        run: |
          set -euo pipefail
          python3 -B TOOLS/package_release.py
          (cd .release && sha256sum --check SHA256SUMS)

      - name: Publish version assets without replacement
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$version"
          notes="V${version}_CHANGES.md"
          archive=".release/RPG_OS_v${version}.zip"
          test -f "$notes" && test -f "$archive"

          # A pre-existing tag must identify this exact commit, even if no release exists yet.
          remote_tag="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            tag_commit="$(git rev-parse "$tag^{commit}")"
            test "$tag_commit" = "$GITHUB_SHA" || { echo 'Version tag belongs to a different commit.' >&2; exit 1; }
          fi

          # Do not replace releases or upload assets again. Only an identical tagged commit is a no-op.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/rpg-os-existing-release.json" 2> "$RUNNER_TEMP/rpg-os-release-error.txt"; then
            test -n "$remote_tag" || { echo 'Existing release has no matching version tag.' >&2; exit 1; }
            python3 - "$RUNNER_TEMP/rpg-os-existing-release.json" "$(basename "$archive")" <<'PY'
          import json
          from pathlib import Path
          import sys

          release = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if release.get("draft") is not False or release.get("prerelease") is not False or not release.get("published_at"):
              raise SystemExit("Existing release is not a published full release; leaving it unchanged for maintainer review.")
          for name in (sys.argv[2], "SHA256SUMS"):
              assets = [asset for asset in release.get("assets", []) if asset.get("name") == name]
              if len(assets) != 1 or assets[0].get("state") != "uploaded" or assets[0].get("size", 0) <= 0:
                  raise SystemExit(f"Existing release has incomplete asset {name}; leaving it unchanged for maintainer review.")
          PY
            echo "Release $tag already exists for this commit; leaving it unchanged."
            exit 0
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/rpg-os-release-error.txt"; then
            cat "$RUNNER_TEMP/rpg-os-release-error.txt" >&2
            exit 1
          fi

          gh release create "$tag" "$archive" .release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "RPG OS $tag" --notes-file "$notes" --latest

      - name: Retire the erroneous v9.0.0 label after verifying v0.9.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          if Path("VERSION").read_text().strip() != "0.9.0":
              raise SystemExit(0)
          repository = os.environ["GITHUB_REPOSITORY"]
          if repository != "croatianrdy2defend-create/RPG-OS":
              raise SystemExit("The numbering correction is restricted to its original repository.")
          prefix = f"repos/{repository}/"
          expected = os.environ["GITHUB_SHA"]
          old_commit = "3d6ad58c920691929295fdc19ba185029a38dbbe"

          def api(path, method="GET", missing_ok=False):
              result = subprocess.run(["gh", "api", prefix + path, "--method", method], capture_output=True, text=True)
              if result.returncode:
                  if missing_ok and "HTTP 404" in result.stderr:
                      return None
                  raise SystemExit(f"GitHub request failed: {result.stderr.strip()}")
              return json.loads(result.stdout) if result.stdout.strip() else None

          def require_commit(ref, sha):
              return ref is not None and ref.get("object", {}).get("type") == "commit" and ref["object"].get("sha") == sha

          new_ref = api("git/ref/tags/v0.9.0")
          release = api("releases/tags/v0.9.0")
          if not require_commit(new_ref, expected) or release.get("tag_name") != "v0.9.0" or release.get("target_commitish") != expected:
              raise SystemExit("The corrected release and tag must identify this exact verified commit.")
          if release.get("draft") is not False or release.get("prerelease") is not False or not release.get("published_at"):
              raise SystemExit("The corrected release must be fully published before retiring the wrong number.")
          for name in ("RPG_OS_v0.9.0.zip", "SHA256SUMS"):
              data = (Path(".release") / name).read_bytes()
              assets = [asset for asset in release.get("assets", []) if asset.get("name") == name]
              digest = "sha256:" + hashlib.sha256(data).hexdigest()
              if len(assets) != 1 or assets[0].get("state") != "uploaded" or assets[0].get("size") != len(data) or assets[0].get("digest") != digest:
                  raise SystemExit(f"The published corrected asset must match the validated package: {name}")

          old_ref = api("git/ref/tags/v9.0.0", missing_ok=True)
          old_release = api("releases/tags/v9.0.0", missing_ok=True)
          if old_ref is None and old_release is None:
              print("The erroneous release and tag are already absent.")
              raise SystemExit(0)
          if not require_commit(old_ref, old_commit):
              raise SystemExit("The old tag does not match the specific numbering error; refusing retirement.")
          if old_release is not None:
              if old_release.get("id") != 384336484 or old_release.get("tag_name") != "v9.0.0" or old_release.get("target_commitish") != old_commit:
                  raise SystemExit("The old release does not match the specific numbering error; refusing retirement.")
              api("releases/384336484", method="DELETE")
          # Check again immediately before tag deletion, including a resumed partial cleanup.
          if not require_commit(api("git/ref/tags/v9.0.0"), old_commit):
              raise SystemExit("The old tag changed during retirement; leaving it untouched.")
          api("git/refs/tags/v9.0.0", method="DELETE")
          print("Retired only the erroneous v9.0.0 release/tag; commit history remains available.")
