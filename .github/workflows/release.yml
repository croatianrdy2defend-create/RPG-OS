name: Publish standalone game-only download
on:
  push:
    branches: [main]
    paths: [GAME/VERSION]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-only-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run retained regression suites
        run: python3 -B DEV/run_tests.py
      - name: Test standalone distribution
        run: python3 -B DEV/test_distribution.py
      - name: Build and verify the game-only package
        run: |
          python3 -B DEV/package_game.py
          (cd .release && sha256sum --check RPG_OS_v*_Game.SHA256SUMS)
      - name: Publish separate game-only assets without replacing historical releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat GAME/VERSION)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="game-v$version"
          prefix="RPG_OS_v${version}_Game"
          remote_tag="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-parse "$tag:GAME")" = "$(git rev-parse HEAD:GAME)" || {
              echo 'Existing game distribution contains different files; do not replace it.' >&2; exit 1;
            }
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/existing-game.json" 2> "$RUNNER_TEMP/game-error.txt"; then
            test -n "$remote_tag"
            python3 - "$RUNNER_TEMP/existing-game.json" "$prefix" <<'PY'
          import hashlib, json, pathlib, sys
          release = json.loads(pathlib.Path(sys.argv[1]).read_text())
          prefix = sys.argv[2]
          assert release.get('draft') is False and release.get('prerelease') is False and release.get('published_at')
          for ext in ('.zip', '.SHA256SUMS', '.manifest.json'):
              assets = [a for a in release.get('assets', []) if a['name'] == prefix + ext]
              assert len(assets) == 1 and assets[0]['state'] == 'uploaded' and assets[0]['size'] > 0
              if ext != '.manifest.json':
                  digest = 'sha256:' + hashlib.sha256(pathlib.Path('.release', prefix + ext).read_bytes()).hexdigest()
                  assert assets[0].get('digest') == digest, 'Existing asset bytes differ; refusing replacement'
          PY
            echo "Distribution $tag already exists for the same playable tree; unchanged."
            exit 0
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/game-error.txt"; then
            cat "$RUNNER_TEMP/game-error.txt" >&2; exit 1
          fi
          printf '%s\n\n' "# RPG OS v$version — playable files only" \
            'This standalone download excludes explanatory documentation, published playtests, developer tests and repository automation. Essential GM operating instructions and optional runtime tools remain included.' \
            'Extract the ZIP and use the folder containing OS/AGENTS.md as the campaign workspace. Never overwrite a live campaign with blank installation records.' \
            "Software version: $version. Source commit: $GITHUB_SHA. This is a separated distribution; older version tags and assets are not replaced." \
            '[Documentation](https://github.com/croatianrdy2defend-create/RPG-OS/tree/main/DOCS) · [Playtests](https://github.com/croatianrdy2defend-create/RPG-OS/tree/main/TEST_REPORTS)' > "$RUNNER_TEMP/game-notes.md"
          gh release create "$tag" ".release/$prefix.zip" ".release/$prefix.SHA256SUMS" ".release/$prefix.manifest.json" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "RPG OS v$version — Game files only" \
            --notes-file "$RUNNER_TEMP/game-notes.md" --latest
