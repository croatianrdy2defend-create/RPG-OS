name: Validate game, documentation layout and published evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate the standalone playable folder
        run: python3 -B GAME/TOOLS/validate.py --root GAME
      - name: Run retained developer regression suites
        run: python3 -B DEV/run_tests.py --report .release/regressions.json
      - name: Test actual standalone distribution and safety boundaries
        run: python3 -B DEV/test_distribution.py
      - name: Verify published record integrity, not new gameplay
        run: python3 -B TEST_REPORTS/2026-09-11-synthetic-campaign/verify_published.py
      - name: Package only the committed game files
        run: |
          python3 -B DEV/package_game.py
          (cd .release && sha256sum --check RPG_OS_v*_Game.SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: game-only-package-and-checks
          path: .release/
          retention-days: 7
