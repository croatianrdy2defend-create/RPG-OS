name: Structural validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate a clean tracked tree
        shell: bash
        run: |
          set -euo pipefail
          kit_dir="$(mktemp -d)"
          git archive --format=tar HEAD | tar -xf - -C "$kit_dir"
          python3 "$kit_dir/TOOLS/validate.py" --root "$kit_dir"
          python3 "$kit_dir/TOOLS/test_validate.py"
