name: RPG OS test report
description: Share a campaign incident or a structural, host-observation, or semantic result.
title: "[Test]: "
body:
  - type: markdown
    attributes:
      value: |
        Brief real-play observations are welcome; a scripted trial or complete reproduction is not required. Include only the details that help explain the incident.

        **Privacy first:** use a sanitized fixture. Do not post private campaign prose, safety boundaries, credentials, account data, prohibited material, or copyrighted rulebook text.

  - type: dropdown
    id: evidence_class
    attributes:
      label: Evidence class
      options:
        - STRUCTURAL
        - HOST OBSERVATION
        - SEMANTIC
        - PLAYER-RATED
    validations:
      required: true

  - type: input
    id: release
    attributes:
      label: RPG OS release or commit
      placeholder: v0.8.0 or commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Host, model and reasoning setting when known
      description: Write unknown where necessary. Include operating system and Python version when relevant to a tool failure.
    validations:
      required: true

  - type: dropdown
    id: clean_copy
    attributes:
      label: Started from a clean unbound copy?
      options:
        - "Yes"
        - "No"
        - Unknown
    validations:
      required: true

  - type: input
    id: starting_save
    attributes:
      label: Starting or relevant save identity (optional)
      description: Include whether this was a new or upgraded campaign when useful; no private GM state is needed here.

  - type: dropdown
    id: law_modified
    attributes:
      label: Was OS/LAW.md modified?
      options:
        - "No"
        - "Yes"
        - Unknown
    validations:
      required: true

  - type: input
    id: test_id
    attributes:
      label: Relevant test scenario or request
      placeholder: Recovery, NEW GAME, SAVE, VALIDATE...

  - type: textarea
    id: reproduction
    attributes:
      label: What happened or how to reproduce it
      description: A brief incident and relevant player declaration are enough to start; add exact steps or minimal files when available.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: validator
    attributes:
      label: Validator output and exit status
      description: Required for structural reports; write not run when it does not apply.
      render: shell

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized supporting evidence
      description: Include AUDIT output or a minimal excerpt only when useful; self-reports are evidence, not independent proof.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Public-report checks
      options:
        - label: I removed private, identifying, prohibited, and unlicensed third-party material.
          required: true
        - label: I have not represented MODEL-CHECKED or one host observation as universal proof.
          required: true
